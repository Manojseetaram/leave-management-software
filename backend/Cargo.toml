[package]
name = "leave-server"
version = "0.1.0"
edition = "2021"

[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.dependencies]
axum = "0.7"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "limit", "set-header"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
async-trait = "0.1"
tracing = "0.1"
argon2 = "0.5"
aes-gcm = "0.10"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"

[dependencies]
api = { path = "crates/api" }
service = { path = "crates/service" }
repository = { path = "crates/repository" }
tokio = { workspace = true }
axum = { workspace = true }
sqlx = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hex = { workspace = true }

[dev-dependencies]
domain = { path = "crates/domain" }
axum = { workspace = true }
tower = { workspace = true, features = ["util"] }
http-body-util = "0.1"
serde_json = { workspace = true }
uuid = { workspace = true }

# Argon2 is intentionally slow; keep it optimized even in debug builds so tests stay fast.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
