services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: leave
      POSTGRES_PASSWORD: leave
      POSTGRES_DB: leave_dev
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leave -d leave_dev"]
      interval: 5s
      retries: 10
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://leave:leave@db:5432/leave_dev
    depends_on:
      db: { condition: service_healthy }
    ports: ["8080:8080"]
volumes:
  pgdata:
